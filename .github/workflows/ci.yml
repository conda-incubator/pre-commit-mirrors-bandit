name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pre-commit-checks:
    name: Pre-commit Checks
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run pre-commit-conda
        uses: quantco/pre-commit-conda@v1
  env:
    name: Test env
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          run-install: false
      - name: Check that the environment is installable
        run: |
          workspace="$RUNNER_TEMP/check-env"
          pixi init --channel conda-forge --platform linux-64 "$workspace"
          # `nodefaults` is a conda only marker that pixi does not understand
          yq 'del(.channels[] | select(. == "nodefaults"))' environment.yml > "$RUNNER_TEMP/environment.yml"
          pixi import --manifest-path "$workspace/pixi.toml" --format conda-env --environment default "$RUNNER_TEMP/environment.yml"
          pixi install --manifest-path "$workspace/pixi.toml"
